<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Gislaine Souza</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#3b0764,#5b21b6,#7c3aed);
color:white;
min-height:100vh;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,rgba(255,255,255,.10),transparent 30%),
radial-gradient(circle at bottom right,rgba(255,255,255,.08),transparent 35%);
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%),
linear-gradient(-45deg,rgba(255,255,255,.03) 25%,transparent 25%);
background-size:70px 70px;
opacity:.25;
z-index:-1;
pointer-events:none;
}

.hidden{
display:none!important;
}

.container{
max-width:470px;
margin:auto;
padding:22px;
min-height:100vh;
}

.topo{
text-align:center;
padding:30px 10px;
}

.logoCircle{
width:110px;
height:110px;
border-radius:50%;
border:2px solid white;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
box-shadow:0 0 30px rgba(255,255,255,.20);
background:rgba(255,255,255,.05);
}

h1{
margin-top:18px;
font-size:34px;
color:white;
}

.sub{
margin-top:8px;
color:#e9d5ff;
font-weight:bold;
}

.card{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.12);
backdrop-filter:blur(10px);
border-radius:30px;
padding:22px;
margin-top:20px;
box-shadow:0 10px 28px rgba(0,0,0,.30);
}

label{
display:block;
margin-top:14px;
font-weight:bold;
color:white;
}

input,select,textarea{
width:100%;
padding:15px;
margin-top:7px;
border-radius:18px;
border:1px solid rgba(255,255,255,.18);
background:#4c1d95;
color:white;
font-size:15px;
}

textarea{
height:90px;
resize:none;
}

button{
border:none;
cursor:pointer;
font-weight:bold;
}

.btn{
width:100%;
padding:16px;
margin-top:18px;
border-radius:20px;
background:white;
color:#5b21b6;
font-size:16px;
box-shadow:0 10px 25px rgba(255,255,255,.20);
}

.btn2{
width:100%;
padding:16px;
margin-top:14px;
border-radius:20px;
background:transparent;
border:2px solid white;
color:white;
font-size:16px;
}

.agenda{
background:#4c1d95;
border-left:5px solid white;
padding:14px;
border-radius:18px;
margin-top:12px;
line-height:1.8;
color:white;
}

.delete{
margin-top:10px;
background:white;
color:#5b21b6;
padding:10px 14px;
border-radius:12px;
}

footer{
text-align:center;
font-size:12px;
margin-top:25px;
color:#ede9fe;
}
</style>
</head>

<body>

<div id="inicio">

<div class="container">

<div class="topo">

<div class="logoCircle">

<svg width="52" height="52" viewBox="0 0 24 24" fill="white">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
2 5.42 4.42 3 7.5 3
9.24 3 10.91 3.81 12 5.09
13.09 3.81 14.76 3 16.5 3
19.58 3 22 5.42 22 8.5
22 12.28 18.6 15.36 13.45 20.04
L12 21.35z"/>
</svg>

</div>

<h1>
Gislaine Souza
</h1>

<p class="sub">
Agenda premium de agendamentos
</p>

</div>

<div class="card">

<button class="btn" onclick="abrirAgenda()">
Abrir Agenda
</button>

<button class="btn2" onclick="abrirLogin()">
Cabeleireira
</button>

</div>

</div>

</div>

<div id="agendaCliente" class="hidden">

<div class="container">

<div class="topo">

<div class="logoCircle">

<svg width="52" height="52" viewBox="0 0 24 24" fill="white">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
2 5.42 4.42 3 7.5 3
9.24 3 10.91 3.81 12 5.09
13.09 3.81 14.76 3 16.5 3
19.58 3 22 5.42 22 8.5
22 12.28 18.6 15.36 13.45 20.04
L12 21.35z"/>
</svg>

</div>

<h1>
Agendar Horário
</h1>

<p class="sub">
Escolha seu procedimento
</p>

</div>

<div class="card">

<label>Serviço</label>

<select id="servico">

<option>Corte feminino - R$50</option>
<option>Corte masculino - R$35</option>
<option>Hidratação com escova - R$60</option>
<option>Progressiva - Consultar valor</option>
<option>Cristalização - Consultar valor</option>

</select>

<label>Escolha a data</label>

<input type="date" id="data">

<label>Escolha o horário</label>

<select id="hora">

<option>07:30</option>
<option>08:00</option>
<option>08:30</option>
<option>09:00</option>
<option>09:30</option>
<option>10:00</option>
<option>10:30</option>
<option>11:00</option>
<option>11:30</option>
<option>12:00</option>
<option>12:30</option>
<option>13:00</option>
<option>13:30</option>
<option>14:00</option>
<option>14:30</option>
<option>15:00</option>
<option>15:30</option>
<option>16:00</option>
<option>16:30</option>
<option>17:00</option>

</select>

<label>Nome da cliente</label>

<input type="text" id="nome" placeholder="Digite seu nome">

<label>Número da cliente</label>

<input type="text" id="telefone" placeholder="Digite seu WhatsApp">

<label>Observação</label>

<textarea id="obs" placeholder="Ex: química no cabelo, referência, manutenção..."></textarea>

<button class="btn" onclick="enviarWhats()">
Confirmar no WhatsApp
</button>

<button class="btn2" onclick="voltarInicio()">
Voltar
</button>

</div>

<footer>
Gislaine Souza
</footer>

</div>

</div>

<div id="login" class="hidden">

<div class="container">

<div class="topo">

<div class="logoCircle">

<svg width="52" height="52" viewBox="0 0 24 24" fill="white">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
2 5.42 4.42 3 7.5 3
9.24 3 10.91 3.81 12 5.09
13.09 3.81 14.76 3 16.5 3
19.58 3 22 5.42 22 8.5
22 12.28 18.6 15.36 13.45 20.04
L12 21.35z"/>
</svg>

</div>

<h1>
Área da Cabeleireira
</h1>

<p class="sub">
Acesso privado
</p>

</div>

<div class="card">

<label>Senha</label>

<input type="password" id="senha">

<button class="btn" onclick="entrarPainel()">
Entrar
</button>

<button class="btn2" onclick="voltarInicio()">
Voltar
</button>

</div>

</div>

</div>

<div id="painel" class="hidden">

<div class="container">

<div class="topo">

<div class="logoCircle">

<svg width="52" height="52" viewBox="0 0 24 24" fill="white">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
2 5.42 4.42 3 7.5 3
9.24 3 10.91 3.81 12 5.09
13.09 3.81 14.76 3 16.5 3
19.58 3 22 5.42 22 8.5
22 12.28 18.6 15.36 13.45 20.04
L12 21.35z"/>
</svg>

</div>

<h1>
Agenda da Cabeleireira
</h1>

<p class="sub">
Controle de agendamentos
</p>

</div>

<div class="card">

<label>Nome da cliente</label>
<input type="text" id="nomePainel">

<label>Telefone</label>
<input type="text" id="fonePainel">

<label>Serviço</label>
<input type="text" id="servicoPainel">

<label>Data</label>
<input type="date" id="dataPainel">

<label>Horário</label>
<input type="time" id="horaPainel">

<label>Observação</label>
<textarea id="obsPainel"></textarea>

<button class="btn" onclick="salvarAgenda()">
Salvar agendamento
</button>

</div>

<div class="card">

<h2 style="text-align:center;color:white;">
Agendamentos
</h2>

<div id="listaAgenda"></div>

<button class="btn2" onclick="voltarInicio()">
Sair
</button>

</div>

<footer>
Agenda Premium
</footer>

</div>

</div>

<script>
let numero="5567996840755";

function esconderTudo(){
document.getElementById("inicio").classList.add("hidden");
document.getElementById("agendaCliente").classList.add("hidden");
document.getElementById("login").classList.add("hidden");
document.getElementById("painel").classList.add("hidden");
}

function voltarInicio(){
esconderTudo();
document.getElementById("inicio").classList.remove("hidden");
}

function abrirAgenda(){
esconderTudo();
document.getElementById("agendaCliente").classList.remove("hidden");
}

function abrirLogin(){
esconderTudo();
document.getElementById("login").classList.remove("hidden");
}

function entrarPainel(){

let senha=document.getElementById("senha").value;

if(senha==="Gi2468@"){
esconderTudo();
document.getElementById("painel").classList.remove("hidden");
mostrarAgenda();
}else{
alert("Senha incorreta.");
}

}

function enviarWhats(){

let servico=document.getElementById("servico").value;
let data=document.getElementById("data").value;
let hora=document.getElementById("hora").value;
let nome=document.getElementById("nome").value;
let telefone=document.getElementById("telefone").value;
let obs=document.getElementById("obs").value;

if(!nome||!telefone||!data){
alert("Preencha nome, telefone e data.");
return;
}

let mensagem=
`Olá!

Gostaria de solicitar um agendamento:

Nome: ${nome}
Telefone: ${telefone}
Serviço: ${servico}
Data: ${data}
Horário: ${hora}
Observação: ${obs || "Nenhuma"}

Aguardo confirmação.`;

window.open(
`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`,
"_blank");

}

let agenda=
JSON.parse(localStorage.getItem("agendaGislaine"))||[];

function salvarStorage(){
localStorage.setItem("agendaGislaine",JSON.stringify(agenda));
}

function salvarAgenda(){

let nome=document.getElementById("nomePainel").value;
let telefone=document.getElementById("fonePainel").value;
let servico=document.getElementById("servicoPainel").value;
let data=document.getElementById("dataPainel").value;
let hora=document.getElementById("horaPainel").value;
let obs=document.getElementById("obsPainel").value;

if(!nome||!data||!hora){
alert("Preencha nome, data e horário.");
return;
}

agenda.push({
nome,
telefone,
servico,
data,
hora,
obs
});

salvarStorage();

document.getElementById("nomePainel").value="";
document.getElementById("fonePainel").value="";
document.getElementById("servicoPainel").value="";
document.getElementById("dataPainel").value="";
document.getElementById("horaPainel").value="";
document.getElementById("obsPainel").value="";

mostrarAgenda();

}

function excluir(index){

agenda.splice(index,1);

salvarStorage();

mostrarAgenda();

}

function mostrarAgenda(){

let lista=document.getElementById("listaAgenda");

lista.innerHTML="";

if(agenda.length===0){

lista.innerHTML=
"<p style='text-align:center;color:#e9d5ff;'>Nenhum horário anotado ainda.</p>";

return;

}

agenda
.slice()
.reverse()
.forEach((a,index)=>{

let real=
agenda.length-1-index;

lista.innerHTML+=`

<div class="agenda">

<strong>${a.nome}</strong><br>

Telefone: ${a.telefone || "-"}<br>

Serviço: ${a.servico || "-"}<br>

Data: ${a.data}<br>

Horário: ${a.hora}<br>

Observação: ${a.obs || "-"}

<button
class="delete"
onclick="excluir(${real})">
Excluir
</button>

</div>

`;

});

}
</script>

</body>
</html>
